services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BANCO_ADMIN_SENHA:?defina BANCO_ADMIN_SENHA no .env}
      BANCO_APP_USUARIO: ${BANCO_APP_USUARIO:?defina BANCO_APP_USUARIO no .env}
      BANCO_APP_SENHA: ${BANCO_APP_SENHA:?defina BANCO_APP_SENHA no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dados-banco:
